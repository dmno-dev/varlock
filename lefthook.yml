pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc}"
      run: bunx eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: branch-name
      run: bun run scripts/check-branch-name.ts
    # catches a lockfile left out of sync with package.json changes (e.g. after
    # a rebase), which otherwise only surfaces as a frozen-lockfile failure in CI.
    # --ignore-scripts: the root `prepare` script runs `lefthook install`, which
    # would try to replace the pre-push hook that is currently executing
    - name: lockfile
      run: bun install --frozen-lockfile --ignore-scripts
    - name: typecheck
      run: bun run typecheck:all
    - name: bumpy
      run: bunx @varlock/bumpy check
