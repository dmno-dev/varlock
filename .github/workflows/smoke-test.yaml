name: Cross-Platform Smoke Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Allow manual trigger for testing
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Only run on release PRs (created by bumpy), PRs with "smoke-tests" label, or manual triggers
# This avoids running expensive multi-platform tests on every PR
jobs:
  check-if-release-pr:
    name: Check if Release PR
    runs-on: depot-ubuntu-24.04
    permissions: {}
    outputs:
      is-release-pr: ${{ steps.check.outputs.is-release-pr }}
    steps:
      - id: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'smoke-tests') }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$PR_TITLE" == *"Versioned release"* ]] || [[ "$HAS_LABEL" == "true" ]] || [[ "$EVENT_NAME" == "workflow_dispatch" ]] || [[ "$EVENT_NAME" == "push" ]]; then
            echo "is-release-pr=true" >> $GITHUB_OUTPUT
          else
            echo "is-release-pr=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build and Pack Libraries
    needs: check-if-release-pr
    if: needs.check-if-release-pr.outputs.is-release-pr == 'true'
    runs-on: depot-ubuntu-24.04-8
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: bun install

      - name: Enable turborepo remote cache
        uses: ./.github/actions/depot-turbo-cache
        with:
          token: ${{ secrets.DEPOT_TURBO_TOKEN }}

      - name: Build varlock and integrations
        run: bun run build:libs

      - name: Build varlock binaries
        run: |
          echo "=== build-binaries.ts content check ==="
          grep -n 'bytecode' packages/varlock/scripts/build-binaries.ts || echo "no bytecode references found"
          echo "=== building ==="
          cd packages/varlock && bun run build:binaries -- --skip-native

      - name: Pack varlock packages
        run: |
          mkdir -p packed-packages
          cd packages/varlock
          bun pm pack --destination ../../packed-packages
          cd ../integrations/nextjs
          bun pm pack --destination ../../../packed-packages

      - name: Upload packed packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-packages
          path: packed-packages/*.tgz
          retention-days: 1

      - name: Upload varlock binary (linux-x64)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: varlock-binary-linux-x64
          path: packages/varlock/dist-sea/linux-x64/varlock
          retention-days: 1

      - name: Upload varlock binary (macos-arm64)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: varlock-binary-macos-arm64
          path: packages/varlock/dist-sea/macos-arm64/varlock
          retention-days: 1

      - name: Upload varlock binary (win-x64)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: varlock-binary-win-x64
          path: packages/varlock/dist-sea/win-x64/varlock.exe
          retention-days: 1

  smoke-test:
    name: Smoke Test (${{ matrix.os }})
    needs: [check-if-release-pr, build]
    if: needs.check-if-release-pr.outputs.is-release-pr == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
      checks: write

    strategy:
      fail-fast: false
      matrix:
        os: [depot-ubuntu-24.04-8, macos-latest, windows-latest]
        node-version: ['24.x']
        include:
          - os: depot-ubuntu-24.04-8
            binary-artifact: varlock-binary-linux-x64
            binary-name: varlock
          - os: macos-latest
            binary-artifact: varlock-binary-macos-arm64
            binary-name: varlock
          - os: windows-latest
            binary-artifact: varlock-binary-win-x64
            binary-name: varlock.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      # the runtime smoke tests exercise `varlock run -- bun ...` and bun's bunfig preload of
      # varlock/auto-load (the fork-bomb regression), all of which skip when bun is absent
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # warm ~/.m2 so the Java lang-module smoke test doesn't re-download from
      # Maven Central on every run (Central rate-limits GitHub runners with 429s)
      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('smoke-tests/smoke-test-lang-java/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download packed packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packed-packages
          path: packed-packages
      
      - name: Download varlock binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.binary-artifact }}
          path: packages/varlock/dist-sea

      - name: Make binary executable
        if: runner.os != 'Windows'
        run: chmod +x packages/varlock/dist-sea/varlock

      - name: Update smoke-tests to use packed packages
        run: node smoke-tests/update-to-packed.js

      - name: Install smoke tests deps
        run: cd smoke-tests && pnpm install

      - name: Run smoke tests
        run: cd smoke-tests && pnpm test
