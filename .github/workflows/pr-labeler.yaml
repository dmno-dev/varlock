# inspired by https://github.com/systeminit/si/blob/main/.github/workflows/community-check.yml

name: Label community PR

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-labeler:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: write
    steps:
      - name: Label PR based on maintainer status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const MAINTAINERS = 'theoephraim philmillman'.split(' ');
            const pr = context.payload.pull_request;
            const isRelease = pr.head.ref === 'bumpy/version-packages';
            const isBot = ['renovate[bot]', 'dependabot[bot]', 'pullfrog[bot]'].includes(pr.user.login);
            const isCopilot = pr.user.login === 'Copilot';
            const isMaintainer = MAINTAINERS.includes(pr.user.login);
            let label = 'community';
            if (isRelease) label = 'release';
            else if (isBot) label = 'bot';
            else if (isMaintainer || isCopilot) label = 'maintainer';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label]
            });
      - name: Label PR based on changed files
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/config/labeler.yaml
