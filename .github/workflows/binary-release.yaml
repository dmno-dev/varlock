name: Re-cut varlock CLI binaries

# Manual re-cut of the varlock CLI standalone (SEA) binaries, homebrew formula,
# and Docker image for an ALREADY-PUBLISHED version.
#
# The normal release flow (release.yaml) builds and uploads these in the same run
# as the npm publish, reusing the in-run signed/notarized native binaries. This
# workflow is only for re-cutting binaries of an existing version — it pulls the
# signed native binaries from the published @varlock/native-helper-* npm packages
# rather than rebuilding + re-signing them, so it needs no macOS/Windows runner,
# no Azure, and no Apple credentials.
#
# Only works for versions with per-platform helper packages (> 1.16.x); earlier
# versions bundled the binaries inside the varlock tarball itself.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to re-cut (ex: "1.2.3")'
        required: true
        type: string

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ inputs.version }}

jobs:
  release-binaries:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless cosign signing of checksums.txt
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: varlock@${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Use Node.js 24.x
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.x"
      - name: Install node deps
        run: bun install
      # No turbo cache: published artifacts are always built from source.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # see the matching step in release.yaml for why cosign is pinned too
          cosign-release: v3.0.6

      # Pull the signed/notarized native binaries from the published npm packages
      # instead of rebuilding + re-signing them.
      - name: Fetch native binaries from published npm packages
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/varlock-npm"
          mkdir -p "$TMP" && cd "$TMP"
          # wait for registry propagation of every package we are about to pack
          wait_for() { # <pkg spec> <max attempts>
            for i in $(seq 1 "$2"); do
              if npm view "$1" version >/dev/null 2>&1; then return 0; fi
              echo "waiting for $1 on npm ($i)..."; sleep 10
            done
            echo "::error::$1 not found on npm. Note: versions <= 1.16.x predate the per-platform @varlock/native-helper-* packages and cannot be re-cut by this workflow."
            return 1
          }
          wait_for "varlock@${RELEASE_VERSION}" 30
          for SUFFIX in darwin linux-x64 linux-arm64 win32-x64; do
            # helpers publish before varlock, so short extra wait once varlock is visible
            wait_for "@varlock/native-helper-${SUFFIX}@${RELEASE_VERSION}" 12
          done
          DEST="$GITHUB_WORKSPACE/packages/varlock/native-bins"
          rm -rf "$DEST"
          # platform suffix -> tarball entry mapping; source of truth is
          # packages/native-helpers/platforms.ts - keep in sync
          fetch() { # <platform suffix> <tarball entry>
            rm -rf package
            npm pack "@varlock/native-helper-$1@${RELEASE_VERSION}"
            tar -xzf "varlock-native-helper-$1-${RELEASE_VERSION}.tgz"
            mkdir -p "$DEST/$1"
            cp -R "package/$2" "$DEST/$1/$2"
          }
          fetch darwin VarlockEnclave.app
          fetch linux-x64 varlock-local-encrypt
          fetch linux-arm64 varlock-local-encrypt
          fetch win32-x64 varlock-local-encrypt.exe
      - name: Restore native binary execute permissions
        run: |
          chmod +x packages/varlock/native-bins/darwin/VarlockEnclave.app/Contents/MacOS/varlock-local-encrypt
          chmod +x packages/varlock/native-bins/linux-x64/varlock-local-encrypt
          chmod +x packages/varlock/native-bins/linux-arm64/varlock-local-encrypt

      - name: Generate native binary SHA256 checksums
        working-directory: packages/varlock
        run: |
          sha256sum \
            native-bins/darwin/VarlockEnclave.app/Contents/MacOS/varlock-local-encrypt \
            native-bins/linux-x64/varlock-local-encrypt \
            native-bins/linux-arm64/varlock-local-encrypt \
            native-bins/win32-x64/varlock-local-encrypt.exe \
            > SHA256SUMS.txt

      - name: Build libs
        run: bun run build:libs
        env:
          BUILD_TYPE: release
      - name: Build varlock SEA binaries
        run: bun run packages/varlock/scripts/build-binaries.ts
      # See the matching step in release.yaml for why only checksums.txt is signed.
      - name: Sign checksums with cosign
        working-directory: packages/varlock/dist-sea
        run: cosign sign-blob --yes --bundle checksums.txt.cosign.bundle checksums.txt

      - name: Upload binaries to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: packages/varlock/dist-sea
        run: gh release upload "$RELEASE_TAG" *.{tar.gz,zip} checksums.txt checksums.txt.cosign.bundle ../SHA256SUMS.txt --clobber

      - name: Checkout homebrew tap repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dmno-dev/homebrew-tap
          token: ${{ secrets.HOMEBREW_REPO_GITHUB_ACCESS_TOKEN }}
          path: homebrew-tap
          clean: false
      - name: Update homebrew formula
        run: bun run scripts/update-homebrew-formula.ts
      - name: Commit and push homebrew tap update
        run: |
          cd homebrew-tap
          git config --global user.name 'theoephraim'
          git config --global user.email 'theo@dmno.dev'
          git add .
          git commit -m "varlock@${RELEASE_VERSION}"
          git tag "varlock@${RELEASE_VERSION}"
          git push origin HEAD --tags

  release-docker:
    needs: release-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/dmno-dev/varlock:${{ env.RELEASE_VERSION }}
            ghcr.io/dmno-dev/varlock:latest
          build-args: |
            VARLOCK_VERSION=${{ env.RELEASE_VERSION }}
          platforms: linux/amd64,linux/arm64
