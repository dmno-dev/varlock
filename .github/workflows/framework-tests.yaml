name: Framework Integration Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      force-all:
        description: 'Run all framework tests regardless of changes'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-integrations:
    name: Detect Changed Integrations
    runs-on: depot-ubuntu-24.04
    permissions:
      actions: read # look up pass marker artifacts
    outputs:
      any-changed: ${{ steps.detect.outputs.any-changed }}
      integrations: ${{ steps.detect.outputs.integrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Detect changed integrations
        id: detect
        run: |
          ARGS=""
          if [[ "${{ github.event.inputs.force-all }}" == "true" ]] || [[ "${{ contains(github.event.pull_request.labels.*.name, 'framework-tests') }}" == "true" ]]; then
            ARGS="--all"
          elif [[ "${{ github.head_ref }}" == "bumpy/version-packages" ]]; then
            ARGS="--release-pr"
          fi
          bun run scripts/detect-changed-integrations.ts $ARGS
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    name: Build Libraries
    needs: detect-integrations
    if: needs.detect-integrations.outputs.any-changed == 'true'
    runs-on: depot-ubuntu-24.04-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: bun install

      - name: Enable turborepo remote cache
        uses: ./.github/actions/depot-turbo-cache
        with:
          token: ${{ secrets.DEPOT_TURBO_TOKEN }}

      - name: Build libraries
        run: bun run build:libs

      - name: Upload built repo for framework tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-repo
          path: |
            packages/*/dist/
            packages/integrations/*/dist/
          retention-days: 1

  test:
    name: Framework Tests (${{ matrix.integration.name }})
    needs: [detect-integrations, build]
    if: needs.detect-integrations.outputs.any-changed == 'true'
    runs-on: depot-ubuntu-24.04-8
    strategy:
      fail-fast: false
      matrix:
        integration: ${{ fromJson(needs.detect-integrations.outputs.integrations) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.local/share/pnpm/store/v3
          key: pnpm-${{ runner.os }}-${{ matrix.integration.name }}-${{ hashFiles('framework-tests/**/package.json') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ matrix.integration.name }}-
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Download built libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-repo
          path: packages/

      - name: Run ${{ matrix.integration.name }} framework tests
        run: cd framework-tests && bun install && bun run test -- --reporter=verbose frameworks/${{ matrix.integration.testPath }}
        timeout-minutes: 15
        env:
          NEXTJS_TURBO_ONLY: ${{ contains(matrix.integration.name, '(quick)') && '1' || '' }}
          NEXTJS_BUNDLER: ${{ matrix.integration.bundler || '' }}
          NEXT_TELEMETRY_DISABLED: '1'

      # Lets later runs skip this suite while its inputs are unchanged
      # (see scripts/framework-test-markers.ts)
      - name: Record pass marker
        if: matrix.integration.fingerprint
        run: mkdir -p "$RUNNER_TEMP/fw-pass" && echo "${{ matrix.integration.name }}" > "$RUNNER_TEMP/fw-pass/suite"
      - name: Save pass marker
        if: matrix.integration.fingerprint
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fw-pass-${{ matrix.integration.fingerprint }}
          path: ${{ runner.temp }}/fw-pass
          retention-days: 7
          overwrite: true
