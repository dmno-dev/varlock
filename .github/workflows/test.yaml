name: CI test suite
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: depot-ubuntu-24.04-8
    outputs:
      release-packages: ${{ steps.check-release.outputs.packages }}
      # Which unsigned preview natives this run needs. On PRs: the preview includes
      # that side's @varlock/native-helper-* packages, which only happens when they
      # have a pending release (see check-release-packages.ts). On main: a helper
      # release is pending, so build them once to warm the main-scoped cache that
      # PR previews restore.
      needs-macos-native: ${{ steps.check-release.outputs.needs-macos-native || steps.native.outputs.macos-pending }}
      needs-rust-native: ${{ steps.check-release.outputs.needs-rust-native || steps.native.outputs.rust-pending }}
      # PR changes that side's sources or build workflow: test-build it even when
      # the preview uses the published helpers
      macos-native-touched: ${{ steps.native.outputs.macos-touched }}
      rust-native-touched: ${{ steps.native.outputs.rust-touched }}
      macos-native-key: ${{ steps.native.outputs.macos-key }}
      rust-native-key: ${{ steps.native.outputs.rust-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
      - name: Install js deps (w/ bun)
        run: bun install
      # Also fails when this branch changes native sources without a helper bump
      # file (see scripts/native-sources.ts)
      - name: Native helper sources
        id: native
        run: bun run scripts/native-sources.ts
      # Blocks only when the PR changes deps; pre-existing advisories are warnings
      # (the nightly audit handles those). The version PR always blocks, so a
      # release can't be merged with a known-critical advisory.
      - name: Audit dependencies
        run: bun run audit:${{ github.head_ref == 'bumpy/version-packages' && 'critical' || 'pr' }}
      - name: Enable turborepo remote cache
        uses: ./.github/actions/depot-turbo-cache
        with:
          token: ${{ secrets.DEPOT_TURBO_TOKEN }}

      # Note: the bumpy release-plan check + comment live in their own workflows
      # (bumpy-check.yaml emits the comment on `pull_request`; bumpy-comment.yaml
      # posts it on `workflow_run`) so it can post on fork PRs without running
      # PR-defined code with write permissions.

      # lint, build, tests  ---------------------------------
      - name: ESLint
        run: bun run lint
      - name: TypeScript type check
        run: bun run typecheck:all
      # offline - verifies generated icon modules match the committed svg files and that each
      # package's license notice credits every bundled icon
      - name: Check bundled icons are up to date
        run: bun run sync-icons --check
      - name: Build libraries
        run: bun run build:libs
      - name: Check plugin bundles are single-file
        run: bun run scripts/check-plugin-bundles.ts
      - name: Run tests
        run: bun run test:ci
      # The vitest suite runs under Node; this check runs the proxy's verified-TLS
      # injection (Invariant #1) under Bun, the runtime the compiled binary uses —
      # Node cannot catch the Bun-specific pre-write leak it guards against.
      - name: Proxy verified-TLS injection (Bun)
        run: bun run --filter varlock test:proxy:bun

      # Determine which packages will be preview-released (used to gate native builds)
      - name: Check release packages
        if: github.ref_name != 'main'
        id: check-release
        run: bun run scripts/check-release-packages.ts

  # Unsigned preview native binaries. Releases never use these (release.yaml always
  # builds natives from source), so they need no signing secrets: macOS is ad-hoc
  # signed, Rust is unsigned. They are cached by native source hash, so an identical
  # build is reused across pushes and, once saved from main, across PRs.
  #
  # Depot runners redirect actions/cache to Depot Cache, where these entries never
  # exist, so lookups and restores of native binaries must run on GitHub runners.
  native-cache-check:
    needs: build-and-test
    if: >-
      needs.build-and-test.outputs.needs-macos-native == 'true'
      || needs.build-and-test.outputs.needs-rust-native == 'true'
      || needs.build-and-test.outputs.macos-native-touched == 'true'
      || needs.build-and-test.outputs.rust-native-touched == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      macos-cache-hit: ${{ steps.macos-cache.outputs.cache-hit }}
      rust-cache-hit: ${{ steps.rust-cache.outputs.cache-hit }}
    steps:
      # Check if native binary caches exist (lookup-only, no download)
      - name: Check macOS binary cache
        id: macos-cache
        if: needs.build-and-test.outputs.needs-macos-native == 'true' || needs.build-and-test.outputs.macos-native-touched == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/varlock/native-bins/darwin/VarlockEnclave.app
          key: ${{ needs.build-and-test.outputs.macos-native-key }}
          lookup-only: true
      - name: Check Rust cache - linux-x64
        id: rust-cache-linux-x64
        if: needs.build-and-test.outputs.needs-rust-native == 'true' || needs.build-and-test.outputs.rust-native-touched == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/varlock/native-bins/linux-x64/
          key: ${{ needs.build-and-test.outputs.rust-native-key }}-linux-x64
          lookup-only: true
      - name: Check Rust cache - linux-arm64
        id: rust-cache-linux-arm64
        if: needs.build-and-test.outputs.needs-rust-native == 'true' || needs.build-and-test.outputs.rust-native-touched == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/varlock/native-bins/linux-arm64/
          key: ${{ needs.build-and-test.outputs.rust-native-key }}-linux-arm64
          lookup-only: true
      - name: Check Rust cache - win32-x64
        id: rust-cache-win32-x64
        if: needs.build-and-test.outputs.needs-rust-native == 'true' || needs.build-and-test.outputs.rust-native-touched == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/varlock/native-bins/win32-x64/
          key: ${{ needs.build-and-test.outputs.rust-native-key }}-win32-x64
          lookup-only: true
      - name: Determine Rust cache status
        id: rust-cache
        if: needs.build-and-test.outputs.needs-rust-native == 'true' || needs.build-and-test.outputs.rust-native-touched == 'true'
        run: |
          if [[ "${{ steps.rust-cache-linux-x64.outputs.cache-hit }}" == "true" \
             && "${{ steps.rust-cache-linux-arm64.outputs.cache-hit }}" == "true" \
             && "${{ steps.rust-cache-win32-x64.outputs.cache-hit }}" == "true" ]]; then
            echo "cache-hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache-hit=false" >> "$GITHUB_OUTPUT"
          fi

  # Build the ad-hoc signed macOS preview binary on a cache miss, when the preview
  # needs it or the PR changes its inputs. No secrets.
  build-native-macos:
    needs: [build-and-test, native-cache-check]
    if: >-
      (needs.build-and-test.outputs.needs-macos-native == 'true' || needs.build-and-test.outputs.macos-native-touched == 'true')
      && needs.native-cache-check.outputs.macos-cache-hit != 'true'
    uses: ./.github/workflows/build-native-macos.yaml
    with:
      mode: preview
      artifact-name: native-bin-macos-ci
      cache-key: ${{ needs.build-and-test.outputs.macos-native-key }}

  # Build the unsigned Rust preview binaries, same conditions as macOS. No secrets.
  build-native-rust:
    needs: [build-and-test, native-cache-check]
    permissions:
      contents: read
    if: >-
      (needs.build-and-test.outputs.needs-rust-native == 'true' || needs.build-and-test.outputs.rust-native-touched == 'true')
      && needs.native-cache-check.outputs.rust-cache-hit != 'true'
    uses: ./.github/workflows/build-native-rust.yaml
    with:
      artifact-name: native-bin-rust-ci
      cache-key: ${{ needs.build-and-test.outputs.rust-native-key }}

  # Publish preview packages via pkg-pr-new
  release-preview-packages:
    needs: [build-and-test, native-cache-check, build-native-macos, build-native-rust]
    # Run even if native builds were skipped (no helper release pending, or cached), but not if anything failed or was cancelled.
    # `!cancelled()` only covers whole-workflow cancellation, so build-and-test must explicitly be a success
    # (a cancelled job leaves its outputs empty). Skip on main, and when there is nothing to release.
    if: >-
      always() && !failure() && !cancelled()
      && github.ref_name != 'main'
      && needs.build-and-test.result == 'success'
      && needs.native-cache-check.result != 'cancelled'
      && needs.build-native-macos.result != 'cancelled'
      && needs.build-native-rust.result != 'cancelled'
      && needs.build-and-test.outputs.release-packages != ''
      && needs.build-and-test.outputs.release-packages != '[]'
    # GitHub runner: restores native binaries from GitHub's cache (see native-cache-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
      - name: Install node deps
        run: bun install
      - name: Enable turborepo remote cache
        uses: ./.github/actions/depot-turbo-cache
        with:
          token: ${{ secrets.DEPOT_TURBO_TOKEN }}

      # Preview natives, only for helper packages in this preview. Download the
      # artifact if the build ran this run, otherwise restore the cached build.
      - name: Download macOS native binary (from this run)
        if: needs.build-and-test.outputs.needs-macos-native == 'true' && needs.build-native-macos.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-bin-macos-ci
          path: packages/varlock/native-bins/darwin/VarlockEnclave.app
      - name: Restore cached macOS native binary
        if: needs.build-and-test.outputs.needs-macos-native == 'true' && needs.build-native-macos.result != 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/varlock/native-bins/darwin/VarlockEnclave.app
          key: ${{ needs.build-and-test.outputs.macos-native-key }}
      - name: Verify and fix native binary permissions
        if: needs.build-and-test.outputs.needs-macos-native == 'true'
        run: |
          BINARY=packages/varlock/native-bins/darwin/VarlockEnclave.app/Contents/MacOS/varlock-local-encrypt
          if [ ! -f "$BINARY" ]; then
            echo "::error::macOS native binary not found — cannot publish varlock preview without it"
            exit 1
          fi
          chmod +x "$BINARY"

      # Rust preview natives, same as macOS above
      - name: Download Rust binaries (from this run)
        if: needs.build-and-test.outputs.needs-rust-native == 'true' && needs.build-native-rust.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-bin-rust-ci-*
          path: packages/varlock/native-bins/
          merge-multiple: false
      # Flatten: download-artifact creates subdirs per artifact name, but we need linux-x64/ etc.
      - name: Flatten Rust artifact directories (from this run)
        if: needs.build-and-test.outputs.needs-rust-native == 'true' && needs.build-native-rust.result == 'success'
        run: |
          cd packages/varlock/native-bins
          for dir in native-bin-rust-ci-*/; do
            subdir=$(echo "$dir" | sed 's/native-bin-rust-ci-//' | sed 's/\///')
            mv "$dir" "$subdir" 2>/dev/null || true
          done

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.build-and-test.outputs.needs-rust-native == 'true' && needs.build-native-rust.result != 'success'
        with:
          path: packages/varlock/native-bins/linux-x64/
          key: ${{ needs.build-and-test.outputs.rust-native-key }}-linux-x64
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.build-and-test.outputs.needs-rust-native == 'true' && needs.build-native-rust.result != 'success'
        with:
          path: packages/varlock/native-bins/linux-arm64/
          key: ${{ needs.build-and-test.outputs.rust-native-key }}-linux-arm64
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.build-and-test.outputs.needs-rust-native == 'true' && needs.build-native-rust.result != 'success'
        with:
          path: packages/varlock/native-bins/win32-x64/
          key: ${{ needs.build-and-test.outputs.rust-native-key }}-win32-x64

      - name: Verify and fix Rust binary permissions
        if: needs.build-and-test.outputs.needs-rust-native == 'true'
        run: |
          MISSING=()
          for SUBDIR in linux-x64 linux-arm64 win32-x64; do
            if [ "$SUBDIR" = "win32-x64" ]; then
              BIN="packages/varlock/native-bins/$SUBDIR/varlock-local-encrypt.exe"
            else
              BIN="packages/varlock/native-bins/$SUBDIR/varlock-local-encrypt"
            fi
            if [ ! -f "$BIN" ]; then
              MISSING+=("$BIN")
            elif [ "$SUBDIR" != "win32-x64" ]; then
              chmod +x "$BIN" && echo "Fixed: $BIN"
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Rust native binaries not found: ${MISSING[*]}"
            exit 1
          fi

      - name: Build publishable npm packages
        run: bun run build:libs
        env:
          BUILD_TYPE: preview
      - name: Release preview packages
        run: bun run scripts/release-preview.ts
        env:
          RELEASE_PACKAGES: ${{ needs.build-and-test.outputs.release-packages }}
